name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Super-light gate: one Python; the full sweep runs locally before push.
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System deps (ffmpeg)
        run: |
          # A bounded, retried apt. This step is the only thing that has ever made
          # this workflow slow: it normally takes ~20 s, but a stalled Azure mirror
          # has made it take 31 minutes. Each attempt is capped so a stall is
          # abandoned and retried rather than waited on; `timeout` exits 124 when it
          # fires, which separates "mirror stalled" from "no such package" in the log.
          for attempt in 1 2 3; do
            # The failure code is read in the `else` branch on purpose: after a plain
            # `if ...; fi`, `$?` is the status of the `if` itself, which is 0 even when
            # the condition failed. Reporting that would print "exit 0" next to the word
            # "failed" and send the next reader looking in the wrong place.
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y ffmpeg; then
              exit 0
            else
              echo "apt attempt ${attempt} failed or stalled (exit $?); retrying"
            fi
            sleep 5
          done
          echo "apt-get install ffmpeg failed three times - the mirror is down, not your change."
          exit 1
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (integration skipped by marker)
        run: pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Rule 15: PEP 8 / style is enforced, not advisory — a violation blocks
    # merging exactly like a failing test. Both check and format-check must
    # exit 0 for this job (and thus the pipeline) to pass.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # Pinned: an unpinned install let ruff 0.16 make Markdown code-fence
        # formatting the default, which started flagging README/EXAMPLES code
        # blocks as unformatted overnight with zero local change. Bump this
        # deliberately, not by surprise.
        run: pip install "ruff==0.15.21"
      - name: Ruff lint (PEP 8 + import order + more)
        run: ruff check .
      - name: Ruff format check (no unformatted files)
        run: ruff format --check .

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise. No member carries torch in its base
    # dependencies, so this is a cached-wheel install: well under a minute,
    # which is the point.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import video_helper"
