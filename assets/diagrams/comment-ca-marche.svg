<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1594 432" width="1594" height="432" role="img" aria-labelledby="vh-title vh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="vh-title">Comment video-helper fonctionne : une vidéo en entrée, des images et du mouvement en sortie, sans quitter votre machine</title>
  <desc id="vh-desc">Une plaque de gauche à droite. Entrée : un fichier vidéo ou une URL HTTP. Le travail, en quatre étapes numérotées : valider le fichier par un aller-retour ffmpeg probe ; convertir, en rééchantillonnant les images par seconde et en redimensionnant à rapport d'aspect préservé ; lire les images via un moteur VidGear, PyAV ou ffmpeg-pipe et estimer le flot optique dense avec DIS, Farneback ou RAFT ; puis assembler, en multiplexant l'audio, en concaténant, en incrustant et en gravant les sous-titres. Sortie : des images en tableaux numpy, des champs de mouvement par pixel et des extraits finis. Dessous, l'objet central atteint par les quatre surfaces que chaque membre expose.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="163" height="78" rx="10"/>
  <text class="n-title" x="110" y="120" text-anchor="middle">une vidéo</text>
  <text class="n-sub" x="110" y="139" text-anchor="middle">fichier ou URL HTTP</text>
  <path class="flow" d="M197 126 H213" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="217" y="54" width="1055" height="144" rx="12"/>
  <text class="panel-label" x="237" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="237" y="94" width="198" height="78" rx="10"/>
  <text class="n-title" x="336" y="127" text-anchor="middle">valider</text>
  <text class="n-sub" x="336" y="146" text-anchor="middle">aller-retour ffmpeg probe</text>
  <text class="step" x="248" y="110">1</text>
  <path class="flow" d="M439 133 H455" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="461" y="94" width="217" height="78" rx="10"/>
  <text class="n-title" x="569" y="127" text-anchor="middle">convertir</text>
  <text class="n-sub" x="569" y="146" text-anchor="middle">fps, taille, aspect préservé</text>
  <text class="step" x="472" y="110">2</text>
  <path class="flow" d="M682 133 H698" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="704" y="94" width="221" height="78" rx="10"/>
  <text class="n-title" x="814" y="127" text-anchor="middle">images + flot optique</text>
  <text class="n-sub" x="814" y="146" text-anchor="middle">VidGear / PyAV / ffmpeg-pipe</text>
  <text class="step" x="715" y="110">3</text>
  <path class="flow" d="M929 133 H945" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="951" y="94" width="302" height="78" rx="10"/>
  <text class="n-title" x="1102" y="127" text-anchor="middle">assembler</text>
  <text class="n-sub" x="1102" y="146" text-anchor="middle">muxage, concat, incrustation, sous-titres</text>
  <text class="step" x="962" y="110">4</text>
  <path class="flow" d="M1279 126 H1295" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1299" y="40">SORTIE</text>
  <rect class="io" x="1299" y="87" width="267" height="78" rx="10"/>
  <text class="n-title" x="1432" y="120" text-anchor="middle">images, mouvement, extraits</text>
  <text class="n-sub" x="1432" y="139" text-anchor="middle">tableaux numpy ou fichiers</text>
  <rect class="core" x="587" y="232" width="420" height="54" rx="10"/>
  <text class="on-dark" x="797" y="253" text-anchor="middle">une bibliothèque, appelée pareil partout</text>
  <text class="on-dark-sub" x="797" y="272" text-anchor="middle">os-helper dessous pour la journalisation et les fichiers</text>
  <path class="tie" d="M797 286 V314 H533 V332"/>
  <path class="tie" d="M797 314 H1061 V332"/>
  <path class="tie" d="M533 314 V332"/>
  <rect class="surface" x="458" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="533" y="360" text-anchor="middle">API Python</text>
  <path class="tie" d="M709 314 V332"/>
  <rect class="surface" x="634" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="709" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M885 314 V332"/>
  <rect class="surface" x="810" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="885" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M1061 314 V332"/>
  <rect class="surface" x="986" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="1061" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="797" y="412" text-anchor="middle">ffmpeg décode sur votre machine ; rien n'est téléversé. Le flot optique RAFT est le seul extra optionnel qui tire des poids de modèle.</text>
</svg>
