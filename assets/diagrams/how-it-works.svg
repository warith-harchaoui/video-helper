<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1444 432" width="1444" height="432" role="img" aria-labelledby="vh-title vh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="vh-title">How video-helper works: a video in, frames and motion out, without leaving your machine</title>
  <desc id="vh-desc">A left-to-right plate. In: a video file or an HTTP URL. The work, in four numbered stages: validate the file with an ffmpeg probe round-trip; convert it, resampling frames per second and resizing while preserving aspect ratio; read frames through a VidGear, PyAV or ffmpeg-pipe backend and estimate dense optical flow with DIS, Farneback or RAFT; then assemble, muxing audio, concatenating, overlaying and burning subtitles. Out: frames as numpy arrays, per-pixel motion fields, and finished clips. Underneath, the core object reached through the four surfaces every member exposes. The caption records that ffmpeg does the decoding locally and nothing is uploaded.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="150" height="78" rx="10"/>
  <text class="n-title" x="103" y="120" text-anchor="middle">a video</text>
  <text class="n-sub" x="103" y="139" text-anchor="middle">file or HTTP URL</text>
  <path class="flow" d="M184 126 H200" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="204" y="54" width="970" height="144" rx="12"/>
  <text class="panel-label" x="224" y="76">WHAT IT DOES</text>
  <rect class="stage" x="224" y="94" width="184" height="78" rx="10"/>
  <text class="n-title" x="316" y="127" text-anchor="middle">validate</text>
  <text class="n-sub" x="316" y="146" text-anchor="middle">ffmpeg probe round-trip</text>
  <text class="step" x="235" y="110">1</text>
  <path class="flow" d="M412 133 H428" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="434" y="94" width="211" height="78" rx="10"/>
  <text class="n-title" x="540" y="127" text-anchor="middle">convert</text>
  <text class="n-sub" x="540" y="146" text-anchor="middle">fps, size, aspect preserved</text>
  <text class="step" x="445" y="110">2</text>
  <path class="flow" d="M649 133 H665" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="671" y="94" width="221" height="78" rx="10"/>
  <text class="n-title" x="781" y="127" text-anchor="middle">frames + optical flow</text>
  <text class="n-sub" x="781" y="146" text-anchor="middle">VidGear / PyAV / ffmpeg-pipe</text>
  <text class="step" x="682" y="110">3</text>
  <path class="flow" d="M896 133 H912" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="918" y="94" width="237" height="78" rx="10"/>
  <text class="n-title" x="1036" y="127" text-anchor="middle">assemble</text>
  <text class="n-sub" x="1036" y="146" text-anchor="middle">mux, concat, overlay, subtitles</text>
  <text class="step" x="929" y="110">4</text>
  <path class="flow" d="M1180 126 H1196" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1200" y="40">OUT</text>
  <rect class="io" x="1200" y="87" width="215" height="78" rx="10"/>
  <text class="n-title" x="1308" y="120" text-anchor="middle">frames, motion, clips</text>
  <text class="n-sub" x="1308" y="139" text-anchor="middle">numpy arrays or files</text>
  <rect class="core" x="506" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="722" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="722" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M722 286 V314 H458 V332"/>
  <path class="tie" d="M722 314 H986 V332"/>
  <path class="tie" d="M458 314 V332"/>
  <rect class="surface" x="383" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="458" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M634 314 V332"/>
  <rect class="surface" x="559" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="634" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M810 314 V332"/>
  <rect class="surface" x="735" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="810" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M986 314 V332"/>
  <rect class="surface" x="911" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="986" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="722" y="412" text-anchor="middle">ffmpeg decodes on your machine; nothing is uploaded. RAFT optical flow is the one optional extra that pulls model weights.</text>
</svg>
