[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-helper"
version = "2.3.1"
description = "Video Helper — utility functions for video processing exposed as library, argparse CLI, click CLI, FastAPI HTTP surface, and MCP tools. Validation, format conversion, frame extraction (VidGear / PyAV / ffmpeg-pipe backends), dense optical flow (DIS/Farneback/RAFT), HTTP-headers passthrough, exact-size padded output, target-file-size two-pass compression, subtitle conversion (SRT/VTT/CSS), and pipeline primitives (black video, image loop, concat, overlay, audio mux, subtitle burn)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"},
]
keywords = ["video", "ffmpeg", "opencv", "pyav", "vidgear", "frames", "subtitles", "extraction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "os-helper>=2.0.0,<3",
    "opencv-python>=4.10.0.84,<5",
    "ffmpeg-python>=0.2.0,<0.3",
    "vidgear>=0.3.3,<1",
]

[project.optional-dependencies]
# PyAV unlocks the windowed-sequential + sparse PyAV backend (best default
# for those access patterns — see SPEED_ANALYSIS.md). Without it the
# dispatcher falls back to VidGear / ffmpeg-pipe.
pyav = ["av>=12,<18"]
# Torch unlocks destination="torch" (NCHW/CTHW RGB on cpu/mps/cuda).
torch = ["torch>=2.0,<3"]
# Pillow unlocks destination="pil" (PIL.Image RGB, size=(W, H)).
pil = ["pillow>=10,<12"]
# Face stack: face-anchored speaker identity (video_helper.faces). ONNX Runtime
# for the YuNet detector / SFace recognizer and PySceneDetect for shot
# segmentation. The accurate ASD engine (LightASD) runs the real Light-ASD net
# in PyTorch with an exact python_speech_features MFCC front-end (no fragile
# ONNX export). Weights (YuNet / SFace / light_asd.pth) are fetched on first use
# (see video_helper.faces.models); opencv-python is already a core dependency.
# HuggingFace-free at runtime.
faces = [
    "onnxruntime>=1.16,<2",
    "scenedetect>=0.6,<1",
    "torch>=2,<3",
    "python_speech_features>=0.6",
]
# Advanced optical-flow features (video_helper.flow): RAFT deep-learning flow
# (method="raft" — torchvision ships pretrained weights itself, auto-downloaded,
# unlike heavier research-repo models) and resize_flow's wavelet-based,
# discontinuity-aware resizing (needs PyWavelets). method="dis"/"farneback"
# without resizing need no extra — opencv-python is already core.
flow = ["torch>=2,<3", "torchvision>=0.15,<1", "PyWavelets>=1.4,<2"]
# CLI-only-with-click extra. The argparse variant needs no runtime dep
# and is always available.
cli = ["click>=8.1,<9"]
# FastAPI HTTP surface (video_helper.api). uvicorn + python-multipart
# so multipart file uploads work out of the box.
api = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
all = ["av>=12,<18", "torch>=2.0,<3", "pillow>=10,<12", "torchvision>=0.15,<1", "PyWavelets>=1.4,<2"]
# MCP extra (video_helper.mcp) — exposes the SAME FastAPI app from `[api]` as
# MCP tools via fastapi-mcp; needs the api extra's runtime deps too.
mcp = [
    "video-helper[api]",
    "fastapi-mcp>=0.3,<1",
    # Cap the MCP SDK below 2.0: fastapi-mcp 0.4.0 declares only `mcp>=1.12`
    # (no upper bound), but mcp 2.0.0 changed the low-level `Server.__init__`
    # signature and breaks fastapi-mcp at import. Pin to the 1.x line until
    # fastapi-mcp ships a 2.x-compatible release (same issue hit md2star).
    "mcp>=1.12,<2",
]
# `dev` keeps the bar low for CI — pytest + httpx (for FastAPI TestClient)
# + click (so the click CLI import always resolves in tests) + api/mcp
# so smoke tests exercise every surface.
dev = [
    "pytest>=8",
    "av>=12,<18",
    "httpx>=0.27",
    "click>=8.1,<9",
    "fastapi>=0.111,<1",
    "python-multipart>=0.0.9,<1",
    "fastapi-mcp>=0.3,<1",
    "mcp>=1.12,<2",
]

[project.scripts]
# argparse-based CLI — no runtime dep beyond stdlib + core package.
video-helper = "video_helper.cli_argparse:main"
# click-based twin — install with [cli] extra.
video-helper-click = "video_helper.cli_click:main"
# MCP server — install with [mcp] extra.
video-helper-mcp = "video_helper.mcp:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/video-helper"
Issues = "https://github.com/warith-harchaoui/video-helper/issues"

[tool.setuptools.packages.find]
include = ["video_helper*"]
exclude = ["tests*", "assets*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# _lightasd is vendored upstream Light-ASD code (tabs, its own style); lint/format
# our own sources, not third-party we don't own.
extend-exclude = ["assets", "tests", "_lightasd"]

[tool.ruff.lint]
# Conservative starter set: pyflakes (F), pycodestyle errors (E), warnings (W),
# isort (I), bugbear (B), comprehensions (C4), pyupgrade (UP), simplify (SIM).
# Easy to tighten later; this is the baseline.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",  # line-too-long — handled by formatter / context-dependent
    "B008",  # function call in argument default — too noisy for our style
    "SIM108",  # ternary preferred over if/else — sometimes hurts readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False in pytest is fine
