# Human-language source of truth for video-helper.
#
# `gui:` holds every string the video-bench page shows. Code refers to these
# keys; this file owns the wording. Read by `os_helper.Locales`, the loader
# shared across the suite (CODING.md 21.3).
#
# There is no `prompts:` section: this package talks to ffmpeg and OpenCV, not
# to a model.
#
# The per-operation parameter labels (`output_format`, `width`, `frame_rate`,
# `target_size_mb`, …) deliberately stay OUT of this file: each one names the
# form field the request actually carries, so the wire's own spelling is what
# makes a field checkable against the API documentation. Translating them
# would hide what is being sent. Codec names (`libx265`, `libx264`) and method
# names (`dis`, `farneback`, `raft`) are likewise identifiers, not words — but
# the explanations beside them are copy, and those are here.

meta:
  default_locale: fr
  supported_locales:
  - fr
  - en

gui:
  # --- head / header -------------------------------------------------------
  page_title:
    fr: Video Helper — Banc vidéo
    en: Video Helper — Video Bench
  hero_title:
    fr: Video Helper — Banc vidéo
    en: Video Helper — Video Bench
  hero_subtitle:
    fr: >-
      Déposez une vidéo, choisissez une opération, lancez-la sur l'API locale,
      puis comparez l'entrée à la sortie et téléchargez le résultat. Tout
      tourne sur votre machine — rien n'est envoyé à un tiers.
    en: >-
      Drop a video, pick an operation, run it on the local API, then compare
      input vs output and download the result. Everything runs on your
      machine — nothing is uploaded to a third party.

  # --- input file ----------------------------------------------------------
  input_label:
    fr: Fichier vidéo d'entrée
    en: Input video file
  drop_hint:
    fr: Déposez un fichier ici ou cliquez pour en choisir un
    en: Drop a file here, or click to choose
  # One key rather than three fragments around two <code> elements: a sentence
  # cut into pieces cannot be reordered by a translator, which is the whole
  # point of keeping it here. The operation names lose their monospace cue and
  # keep their meaning.
  input_note:
    fr: >-
      L'opération black n'a besoin d'aucune entrée ; image-loop attend ici une
      image fixe.
    en: >-
      The black operation needs no input; image-loop expects a still image
      here.
  field_optional:
    fr: (optionnel)
    en: (optional)
  # The odd one out among the parameter labels: the field this input fills is
  # `output_format`, so "audio format" is a description rather than a wire
  # name, and descriptions belong here.
  audio_format_label:
    fr: format audio
    en: audio format

  # --- operation selector --------------------------------------------------
  # The operation name is the API's own and stays; what follows the dash is the
  # description, and that is what gets translated.
  operation_label:
    fr: Opération
    en: Operation
  op_validate:
    fr: validate — est-ce une vidéo valide ? (JSON)
    en: validate — is this a valid video? (JSON)
  op_dimensions:
    fr: dimensions — largeur / hauteur / durée / fps (JSON)
    en: dimensions — width / height / duration / fps (JSON)
  op_duration:
    fr: duration — longueur en secondes (JSON)
    en: duration — length in seconds (JSON)
  op_convert:
    fr: convert — ré-encoder / redimensionner / retirer le son
    en: convert — re-encode / resize / drop audio
  op_chunk:
    fr: chunk — extraire une tranche [début, fin]
    en: chunk — extract a [start, end] slice
  op_black:
    fr: black — synthétiser un clip noir uni
    en: black — synthesize a solid-black clip
  op_compress:
    fr: compress — compresser en deux passes vers une taille de fichier cible
    en: compress — two-pass compress to a target file size
  op_image_loop:
    fr: image-loop — boucler une image fixe en clip
    en: image-loop — loop a still image into a clip
  op_concat:
    fr: concat — joindre plusieurs clips bout à bout
    en: concat — join multiple clips head-to-tail
  op_overlay:
    fr: overlay — incruster une image fixe sur la vidéo
    en: overlay — burn a still image onto the video
  op_extract_audio:
    fr: extract-audio — extraire la piste audio
    en: extract-audio — dump the audio track
  op_mux_audio:
    fr: mux-audio — attacher une piste audio
    en: mux-audio — attach an audio track
  op_burn_subs:
    fr: burn-subs — incruster les sous-titres dans les images
    en: burn-subs — burn subtitles into frames
  op_srt2vtt:
    fr: srt2vtt — SRT → WebVTT + CSS (zip)
    en: srt2vtt — SRT → WebVTT + CSS (zip)
  op_extract_frames:
    fr: extract-frames — images PNG (zip)
    en: extract-frames — PNG frames (zip)
  op_extract_flow:
    fr: extract-flow — flot optique dense (visualisation mp4 ou .npy)
    en: extract-flow — dense optical flow (mp4 viz or .npy)

  # --- optical-flow options ------------------------------------------------
  flow_dis:
    fr: dis (rapide, CPU, rien à installer de plus)
    en: dis (fast, CPU, no extra install)
  flow_farneback:
    fr: farneback (CPU, rien à installer de plus)
    en: farneback (CPU, no extra install)
  flow_raft:
    fr: raft (apprentissage profond, nécessite l'extra [flow])
    en: raft (deep learning, needs the [flow] extra)
  flow_out_video:
    fr: video — mp4 de visualisation HSV
    en: video — HSV-visualization mp4
  flow_out_npy:
    fr: npy — tableau de flot brut (T, H, W, 2)
    en: npy — raw (T, H, W, 2) flow array

  # --- secondary file inputs -----------------------------------------------
  extra_clips_label:
    fr: clip(s) supplémentaire(s) — concat exige au moins une deuxième vidéo
    en: extra clip(s) — concat needs at least a second video
  overlay_image_label:
    fr: image à incruster
    en: image to overlay
  mux_audio_label:
    fr: piste audio à attacher
    en: audio track to attach
  subs_label:
    fr: sous-titres (.srt / .vtt / .ass)
    en: subtitles (.srt / .vtt / .ass)

  # --- action + results ----------------------------------------------------
  run_button:
    fr: Lancer
    en: Run
  input_heading:
    fr: Entrée
    en: Input
  output_heading:
    fr: Sortie
    en: Output
  input_still_alt:
    fr: image fixe d'entrée
    en: input still
  output_still_alt:
    fr: image fixe de sortie
    en: output still
  download_link:
    fr: Télécharger le résultat
    en: Download result

  # --- language toggle -----------------------------------------------------
  lang_toggle_href:
    fr: /gui?lang=en
    en: /gui?lang=fr
  lang_toggle_flag:
    fr: 🇬🇧
    en: 🇫🇷
  lang_toggle_aria:
    fr: English version
    en: Version française

  # --- strings written by the page's script --------------------------------
  # Templates carry named fields rather than being glued together in
  # JavaScript, so a translator can reorder the sentence (section 21.3.5).
  js_need_input:
    fr: Choisissez d'abord un fichier d'entrée.
    en: Pick an input file first.
  js_overlay_needs_image:
    fr: overlay a besoin d'un fichier image.
    en: overlay needs an image file.
  js_mux_needs_audio:
    fr: mux-audio a besoin d'un fichier audio.
    en: mux-audio needs an audio file.
  js_burn_subs_needs_subs:
    fr: burn-subs a besoin d'un fichier de sous-titres.
    en: burn-subs needs a subtitles file.
  js_running:
    fr: En cours…
    en: Running…
  js_error_prefix:
    fr: 'Erreur '
    en: 'Error '
  js_done:
    fr: Terminé.
    en: Done.
  js_zip_note:
    fr: Plusieurs fichiers réunis dans un .zip.
    en: Multiple files bundled as a .zip.
  js_npy_note:
    fr: >-
      Tableau de flot brut (.npy) — téléchargement seulement, pas d'aperçu
      intégré.
    en: Raw flow array (.npy) — download only, no inline preview.
  js_request_failed:
    fr: 'Échec de la requête : {error}'
    en: 'Request failed: {error}'
